<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Blood Bank Management System{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #222;
        }

        .navbar {
            background: #8b0000;
            color: white;
            padding: 18px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h1 {
            font-size: 22px;
        }

        .navbar span {
            font-size: 14px;
            opacity: 0.9;
        }

        .container {
            display: flex;
            min-height: calc(100vh - 65px);
        }

        .sidebar {
            width: 230px;
            background: #ffffff;
            border-right: 1px solid #ddd;
            padding: 20px 10px;
        }

        .sidebar h3 {
            padding: 10px 15px;
            color: #8b0000;
            margin-bottom: 10px;
        }

        .sidebar a {
            display: block;
            text-decoration: none;
            color: #333;
            padding: 12px 15px;
            margin: 4px 0;
            border-radius: 6px;
        }

        .sidebar a:hover {
            background: #ffe5e5;
            color: #8b0000;
        }

        .content {
            flex: 1;
            padding: 30px;
        }

        .page-title {
            margin-bottom: 25px;
        }

        .page-title h2 {
            color: #8b0000;
            margin-bottom: 5px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            color: #666;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .card .number {
            font-size: 32px;
            font-weight: bold;
            color: #8b0000;
        }

        .table-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #8b0000;
            color: white;
        }

        tr:hover {
            background: #fafafa;
        }

        .btn {
            display: inline-block;
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            background: #8b0000;
            color: white;
        }

        .btn:hover {
            background: #650000;
        }

        .btn-danger {
            background: #dc3545;
        }

        .form-container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 700px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        @media (max-width: 900px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

            .sidebar {
                width: 190px;
            }
        }
    </style>
</head>

<body>

    <div class="navbar">
        <h1>🩸 Blood Bank Management System</h1>
        <span>Donation & Issue Management</span>
    </div>

    <div class="container">

        <aside class="sidebar">

            <h3>Navigation</h3>

            <a href="/">🏠 Dashboard</a>
            <a href="/donors">👤 Donors</a>
            <a href="/patients">🧑‍⚕️ Patients</a>
            <a href="/hospitals">🏥 Hospitals</a>
            <a href="/donations">🩸 Donations</a>
            <a href="/inventory">📦 Inventory</a>
            <a href="/requests">📋 Blood Requests</a>
            <a href="/issues">💉 Blood Issues</a>

        </aside>

        <main class="content">

            {% block content %}
            {% endblock %}

        </main>

    </div>

</body>
</html>
